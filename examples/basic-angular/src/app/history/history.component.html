<div class="message-container">
  @for (message of Frames; track message) {
  <div class="message__box">
    <p class="message__id">{{ message.frameId }}</p>
    <div>
      [ @for (point of message.interactions; track point) {
      <p class="message__tp">
        {{ JSON.stringify(point) }}
      </p>
      } ]
    </div>
  </div>
  }
</div>
