<!-- Toolbar -->
<div class="toolbar" role="banner">
  <img id="reflex-logo" alt="ReFlex Logo" src="assets/img/reflex-logo.png" />
  <span class="toolbar__title">{{ title }}</span>
  <div class="spacer"></div>
  <img id="htw-logo-img" alt="HTW-Logo" src="assets/img/logo--image.png" />
  <img id="htw-logo-text" alt="HTW-Logo" src="assets/img/logo--text.png" />
</div>

<div class="content" role="main" #interactionCanvas>
  @for (tp of touchPoints$ | async; track tp) {
  <div>
    <div
      class="touchPoint"
      [style]="
        'transform: translate(' +
        tp.position.x * this.width +
        'px, ' +
        tp.position.y * this.height +
        'px) scale(' +
        math.abs(tp.position.z) +
        ');'
      "
    >
      <div
        class="touchPoint__outerCircle {{
          tp.position.z < 0 ? ' push' : ' pull'
        }}"
      ></div>
      <div class="touchPoint__innerCircle">
        <p>{{ tp.touchId }}</p>
      </div>
    </div>
  </div>
  }
</div>

<app-status></app-status>

<app-history></app-history>

<router-outlet></router-outlet>
