# Build, test .NET Solution (without executables)
name: "ReFlex: Build, Test .NET Solution"

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # run when main branch is updated and on pull requests
  # as result, child workflows are not triggered anymore on prs
  pull_request:
    types: [ opened, reopened, edited, synchronize ]
    branches:
      - main

jobs:
  test_python_grpc:
    name: test Python extraction, gRPC and notebooks
    uses: ./.github/workflows/python-grpc-test.yml
  # build .NET solution
  build_reflex:
    name: build and test .NET Solution
    runs-on: windows-latest
    steps:
      - name: checkout repo with submodules
        uses: actions/checkout@main
      - name: setup .NET and restore nuget packages
        uses: ./.github/actions/net-install
      - name: build ReFlex without external sensors
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: dotnet build ReFlex.sln -c CI /p:Platform=x64
      - name: execute tests
        run: dotnet test ReFlex.sln -c CI /p:Platform=x64 --logger trx --results-directory "${{ github.workspace }}/test/artifacts/test-results-net"
      - name: Upload .NET test results
        if: ${{ always() }}
        uses: actions/upload-artifact@main
        with:
          name: .NET Test Results (Solution)
          path: ${{ github.workspace }}/test/artifacts/test-results-net/**/*.trx
          if-no-files-found: warn
