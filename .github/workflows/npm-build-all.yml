name: "ReFlex: Build/Lint/Test all npm projects"

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, reopened, edited, synchronize ]
    branches:
      - main

jobs:
  angular-lint:
    runs-on: windows-latest
    name: install and build
    steps:
      - name: checkout repo with submodules
        uses: actions/checkout@main
      - name: setup node and install packages
        uses: ./.github/actions/npm-install
      - name: build complete (build / lint / test-ci commands in each workspace)
        run: npm run build-complete
      - name: Verify Angular test and coverage reports
        run: node scripts/verify-angular-reports.cjs
      - name: Attach Angular test and coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@main
        with:
          name: angular-test-reports
          path: |
            test/artifacts/coverage
            test/artifacts/tests
          if-no-files-found: error
