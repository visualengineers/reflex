name: "Library: Update README package versions"

on:
  pull_request:
    paths:
      - 'library/src/**/*.csproj'
      - 'library/src/ReFlex.Library.sln'
      - 'library/README.md'
      - 'scripts/update_library_package_versions.py'
      - '.github/workflows/library-readme-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-readme-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check README package versions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_library_package_versions.py

          if ! git diff --exit-code -- library/README.md; then
            echo '::error file=library/README.md::Package versions are out of date. Run python3 scripts/update_library_package_versions.py locally and commit library/README.md in this pull request.'
            exit 1
          fi
