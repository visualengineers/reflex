# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: "Pages: Deploy"

on:  
  # Runs on pushes targeting the default branch
  push:
    branches: 
      - pages
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # allows to reuse this workflow
  workflow_call:
    inputs:
      test_reports_artifact:
        description: Reports artifact from the current workflow run
        type: string
        default: ""

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Pages
        uses: actions/configure-pages@main
      - name: Copy Existing Files
        working-directory: ./
        run: bash ${{ github.workspace }}/scripts/copy_docs.sh 
      - name: Download test reports from this workflow run
        if: inputs.test_reports_artifact != ''
        uses: actions/download-artifact@main
        with:
          name: ${{ inputs.test_reports_artifact }}
          path: docs/test
      - name: restore test reports cache
        if: inputs.test_reports_artifact == ''
        uses: actions/cache/restore@main
        id: cache-reports
        with:
          path: ${{ github.workspace }}/docs/test
          key: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-reports-
            test-reports
          enableCrossOsArchive: true
      - name: Verify test reports before publishing
        shell: bash
        run: |
          test -s docs/test/library/report/index.html
          test -s docs/test/server/report/reflex-tracking-server/index.html
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@main
        with:
          source: ./docs/
          destination: ./_site
      - name: Verify reports in the generated site
        shell: bash
        run: |
          test -s _site/test/library/report/index.html
          test -s _site/test/server/report/reflex-tracking-server/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@main

  # Deployment job
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@main
